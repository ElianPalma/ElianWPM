    <div class="whatsapp-bubble">

<style>

          .whatsapp-bubble {
              position: fixed;
              left: 20px; /* Ajusta la distancia desde el borde izquierdo */
              bottom: 100px; /* Ajusta la distancia desde el borde inferior */
              background-color: #387df485; /* Color verde de WhatsApp */
              color: white;
              border-radius: 50%;
              width: 60px;
              height: 60px;
              display: flex;
              justify-content: center;
              align-items: center;
              font-size: 24px;
              cursor: pointer;
              box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
              z-index: 1000; /* Asegura que esté por encima de otros elementos */
          }

          .whatsapp-bubble:hover {
              opacity: 0.8;
          }

          .whatsapp-bubble a {
              color: white;
              text-decoration: none;
              display: flex;
              justify-content: center;
              align-items: center;
              width: 100%;
              height: 100%;
          }

          /* Opcional: Icono de WhatsApp (puedes usar un emoji o una fuente de iconos) */
          .whatsapp-icon {
              font-size: 30px;
          } 

#botonArriba {
  display: none; /* Oculto inicialmente */
  position: fixed; /* Fijo en la pantalla */
  bottom: 100px; /* Distancia desde la parte inferior */
  right: 20px; /* Distancia desde la derecha */
  z-index: 99; /* Asegura que esté por encima de otros elementos */
  border: none;
  outline: none;
  background-color: #1f2125; /* Color de fondo */
  color: white; /* Color del texto/icono */
  cursor: pointer;
  padding: 10px;
  border-radius: 5px;
  font-size: 16px;
  opacity: 0.7; /* Transparencia inicial */
  transition: opacity 0.3s ease-in-out; /* Transición suave para la opacidad */
}

#botonArriba:hover {
  opacity: 1; /* Más visible al pasar el ratón */
}

#botonArriba svg {
  width: 20px;
  height: 20px;
}

</style>


<script>

// Obtener el botón por su ID
let miBoton = document.getElementById("botonArriba");

// Mostrar el botón cuando el usuario scrollea hacia abajo 20px desde la parte superior del documento
window.onscroll = function() {scrollFunction()};

function scrollFunction() {
  if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
    miBoton.style.display = "block";
  } else {
    miBoton.style.display = "none";
  }
}

// Hacer que el botón regrese al inicio con un desplazamiento suave cuando se hace clic
miBoton.addEventListener("click", function() {
  // Para navegadores modernos con desplazamiento suave
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
});

</script>
